name: Validate site submissions

on:
  pull_request:
    paths:
      - "sites/**"
      - "schemas/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: npm run build
      - name: Ensure generated index is current
        run: git diff --exit-code public/sites.json
